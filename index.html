<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Настоечная</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#d4af37">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #1a1a1a 0%, #2a2a2a 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            max-width: 400px;
            width: 100%;
            background: #2a2a2a;
            border-radius: 32px;
            padding: 32px 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            text-align: center;
            border: 1px solid #d4af37;
        }
        .logo { font-size: 80px; margin-bottom: 12px; }
        h1 { font-size: 28px; font-weight: 800; margin-bottom: 8px; color: #d4af37; }
        .sub { color: #f0f0f0; font-size: 14px; margin-bottom: 32px; opacity: 0.8; }
        .install-buttons { display: flex; flex-direction: column; gap: 16px; margin-bottom: 32px; }
        .install-btn {
            display: flex; align-items: center; justify-content: center; gap: 12px;
            padding: 16px; border: none; border-radius: 60px;
            font-size: 17px; font-weight: 600; cursor: pointer; transition: transform 0.1s;
        }
        .install-btn:active { transform: scale(0.97); }
        .install-btn-android {
            background: linear-gradient(135deg, #d4af37 0%, #b8962e 100%);
            color: #1a1a1a; box-shadow: 0 4px 15px rgba(212, 175, 55, 0.4);
        }
        .install-btn-ios {
            background: linear-gradient(135deg, #1C1C1E 0%, #2C2C2E 100%);
            color: white; box-shadow: 0 6px 20px rgba(0,0,0,0.3); border: 1px solid #d4af37;
        }
        .nav-btn {
            display: block; padding: 14px; margin-bottom: 12px; border-radius: 15px;
            text-decoration: none; font-size: 16px; font-weight: 500; transition: opacity 0.2s;
        }
        .nav-btn:hover { opacity: 0.9; }
        .nav-menu { background: linear-gradient(135deg, #d4af37 0%, #b8962e 100%); color: #1a1a1a; font-weight: bold; }
        .nav-contacts { background: linear-gradient(135deg, #3a3a3a 0%, #4a4a4a 100%); color: #d4af37; border: 1px solid #d4af37; }
        .nav-call { background: linear-gradient(135deg, #E8E4D5 0%, #D8D4C5 100%); color: #1a1a1a; }
        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); backdrop-filter: blur(8px); z-index: 200;
            justify-content: center; align-items: center;
        }
        .modal.show { display: flex; }
        .modal-content {
            background: #2a2a2a; border: 1px solid #d4af37; border-radius: 28px;
            max-width: 300px; width: 85%; padding: 24px 20px 28px; text-align: center; color: #f0f0f0;
        }
        .modal-content h3 { margin-bottom: 16px; color: #d4af37; }
        .step { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; text-align: left; }
        .step-num {
            background: #d4af37; color: #1a1a1a; width: 24px; height: 24px; border-radius: 12px;
            display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">🍸</div>
        <h1>Настоечная</h1>
        <div class="sub">Установите приложение на телефон</div>

        <div class="install-buttons" id="installButtons">
            <button class="install-btn install-btn-android" id="installBtnAndroid">Установить приложение</button>
            <button class="install-btn install-btn-ios" id="installBtnIOS">Установить приложение</button>
        </div>

        <div>
            <a href="https://nastoechnay.ru/#menu" class="nav-btn nav-menu">📋 Меню</a>
            <a href="https://nastoechnay.ru/#contacts" class="nav-btn nav-contacts">📍 Контакты</a>
            <a href="tel:+79999999999" class="nav-btn nav-call">📞 Позвонить</a>
        </div>
    </div>

    <div class="modal" id="iosModal">
        <div class="modal-content">
            <h3>📱 Установить на iPhone</h3>
            <div class="step"><span class="step-num">1</span><span>Нажмите «Поделиться» ⎕</span></div>
            <div class="step"><span class="step-num">2</span><span>Прокрутите вниз → «На экран Домой»</span></div>
            <div class="step"><span class="step-num">3</span><span>Нажмите «Добавить»</span></div>
            <button class="install-btn install-btn-ios" onclick="document.getElementById('iosModal').classList.remove('show')">Закрыть</button>
        </div>
    </div>

    <div class="modal" id="androidModal">
        <div class="modal-content">
            <h3>🤖 Установить на Android</h3>
            <div class="step"><span class="step-num">1</span><span>Нажмите ⋮ в правом верхнем углу</span></div>
            <div class="step"><span class="step-num">2</span><span>Выберите «Установить приложение»</span></div>
            <div class="step"><span class="step-num">3</span><span>Подтвердите установку</span></div>
            <button class="install-btn install-btn-android" onclick="document.getElementById('androidModal').classList.remove('show')">Закрыть</button>
        </div>
    </div>

    <script>
        let deferredPrompt = null;
        const installButtons = document.getElementById('installButtons');
        const installBtnAndroid = document.getElementById('installBtnAndroid');
        const installBtnIOS = document.getElementById('installBtnIOS');
        const iosModal = document.getElementById('iosModal');
        const androidModal = document.getElementById('androidModal');

        const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;
        const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent);
        const isAndroid = /Android/.test(navigator.userAgent);

        if (isStandalone) {
            installButtons.style.display = 'none';
        } else {
            if (isIOS) installBtnAndroid.style.display = 'none';
            else if (isAndroid) installBtnIOS.style.display = 'none';

            window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); deferredPrompt = e; });

            installBtnAndroid.addEventListener('click', async () => {
                if (deferredPrompt) {
                    deferredPrompt.prompt();
                    const { outcome } = await deferredPrompt.userChoice;
                    if (outcome === 'accepted') { installButtons.style.display = 'none'; localStorage.setItem('pwa-installed', 'true'); }
                    deferredPrompt = null;
                } else { androidModal.classList.add('show'); }
            });

            installBtnIOS.addEventListener('click', () => { iosModal.classList.add('show'); });

            window.addEventListener('appinstalled', () => { installButtons.style.display = 'none'; localStorage.setItem('pwa-installed', 'true'); deferredPrompt = null; });
        }

        if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js'); }
    </script>
</body>
</html>
