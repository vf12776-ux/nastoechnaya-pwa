<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Настоечная</title>
    <meta name="theme-color" content="#d4af37">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="icons/icon-192.png">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Настоечная</h1>
        <nav>
            <button onclick="showSection('menu')" class="nav-btn active">Меню</button>
            <button onclick="showSection('contacts')" class="nav-btn">Контакты</button>
        </nav>
    </header>

    <main>
        <!-- Секция Меню -->
        <section id="menu" class="content-section active">
            <h2>Наше Меню</h2>
            <div id="menu-list">
                <!-- Сюда JS подгрузит позиции -->
            </div>
        </section>

        <!-- Секция Контакты -->
        <section id="contacts" class="content-section">
            <h2>Контакты</h2>
            <div class="contact-info">
                <p>📍 Адрес: г. Москва, ул. Примерная, д. 1</p>
                <p>📞 Телефон: <a href="tel:+79999999999">+7 (999) 999-99-99</a></p>
                <p>⏰ Режим работы: Ежедневно с 12:00 до 00:00</p>
                <a href="https://yandex.ru/maps" target="_blank" class="map-btn">Показать на карте</a>
            </div>
        </section>
    </main>

    <script src="app.js"></script>
    <script>
        // Регистрация Service Worker для PWA
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js')
                .then(() => console.log('Service Worker зарегистрирован'))
                .catch(err => console.error('Ошибка SW:', err));
        }
    </script>
</body>
</html>
